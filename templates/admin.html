<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL BRUSTO | Admin Orders</title>
<style>
:root{--wine:#54130f;--red:#7d241b;--cream:#fff8ed;--gold:#d9ad68;--ink:#3b1b16}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#260706,#641a12,#35100c);color:var(--cream);min-height:100vh}
header{padding:22px max(18px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #ffffff22;background:#1c0505aa}
h1,h2,h3,p{margin-top:0}header h1{font-size:22px;margin:0;color:#f5d9a7;letter-spacing:1px}header p{margin:5px 0 0;color:#e4c9b8;font-size:13px}
button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:11px 15px;background:var(--gold);color:#32100b;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.06)}button.secondary{background:#f4e5d2}button.danger{background:#f0b4a9}
main{max-width:1200px;margin:28px auto;padding:0 18px}.panel{background:var(--cream);color:var(--ink);border-radius:16px;padding:22px;box-shadow:0 16px 40px #0003;margin-bottom:20px}.login{max-width:440px;margin:8vh auto}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input,.field select,.field textarea{width:100%;border:1px solid #d8bda3;border-radius:8px;padding:11px;background:white;color:#30140f}.muted{color:#7a5547;font-size:13px}.message{min-height:22px;color:#a12619;font-size:14px;font-weight:700}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.order{border:1px solid #e3cbb0;border-radius:13px;padding:16px;background:#fffdf8}.order h3{margin:0}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.pill{display:inline-block;background:#f0e0ca;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.items{border-top:1px solid #ead9c5;border-bottom:1px solid #ead9c5;padding:10px 0;margin:12px 0;font-size:14px}.item{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.order label{font-size:13px;font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.order-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.hidden{display:none!important}
@media(max-width:520px){.two{grid-template-columns:1fr}.panel{padding:16px}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div><h1>EL BRUSTO · ADMIN</h1><p>Order management and delivery scheduling</p></div><div id="header-actions" class="hidden"><button class="secondary" id="refresh-btn">Refresh orders</button> <button id="logout-btn">Log out</button></div></header>
<main>
<section class="panel login" id="login-panel">
<h2>Admin sign in</h2><p class="muted">Only authorized staff should use this page.</p>
<form id="login-form">
<div class="field"><label for="username">Admin username</label><input id="username" autocomplete="username" required></div>
<div class="field"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button type="submit">Sign in</button><p class="message" id="login-message"></p>
</form></section>
<section id="dashboard" class="hidden">
<div class="panel"><div class="toolbar"><div><h2 style="margin-bottom:5px">Customer orders</h2><p class="muted">Filter transactions by current order status, then open an order to update it.</p></div><div id="summary-count" class="pill">0 orders</div></div>
<div class="toolbar" style="margin-top:16px;justify-content:flex-start"><div class="field" style="min-width:min(280px,100%);margin:0"><label for="status-filter">Transaction status filter</label><select id="status-filter"><option value="All">All transactions</option><option>Pending</option><option>Confirmed</option><option>Preparing</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select></div><div id="filtered-count" class="muted" aria-live="polite"></div></div></div>
<div id="orders" class="orders"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
let allOrders=[];
async function api(url,options={}) {
 const response=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||"Request failed");
 return data;
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showDashboard(){ $("#login-panel").classList.add("hidden");$("#dashboard").classList.remove("hidden");$("#header-actions").classList.remove("hidden");loadOrders();}
$("#login-form").addEventListener("submit",async e=>{e.preventDefault();$("#login-message").textContent="Signing in...";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({username:$("#username").value,password:$("#password").value})});$("#password").value="";showDashboard();}catch(err){$("#login-message").textContent=err.message;}});
async function loadOrders(){
 const box=$("#orders");box.innerHTML='<div class="panel">Loading orders...</div>';
 try{
  const data=await api("/api/admin/orders");allOrders=data.orders||[];$("#summary-count").textContent=`${allOrders.length} transaction${allOrders.length===1?"":"s"}`;
  renderOrders();
 }catch(err){if(err.message==="ADMIN_LOGIN_REQUIRED"){ $("#dashboard").classList.add("hidden");$("#login-panel").classList.remove("hidden");$("#header-actions").classList.add("hidden");}else box.innerHTML=`<div class="panel">${esc(err.message)}</div>`;}
}
function renderOrders(){
 const box=$("#orders");
 const selected=$("#status-filter")?.value||"All";
 const visible=selected==="All"?allOrders:allOrders.filter(o=>o.status===selected);
 $("#filtered-count").textContent=`Showing ${visible.length} of ${allOrders.length} transaction${allOrders.length===1?"":"s"}`;
 if(!visible.length){box.innerHTML='<div class="panel">No transactions match this filter.</div>';return;}
 box.innerHTML=visible.map(o=>{
   const items=(o.items||[]).map(i=>`<div class="item"><span>${i.quantity} × ${esc(i.name)}</span><b>₱${Number(i.subtotal).toFixed(2)}</b></div>`).join("");
   return `<article class="order" data-id="${o.id}">
    <div class="order-head"><div><h3>Order #${o.id}</h3><p class="muted" style="margin:5px 0">${esc(o.first_name)} ${esc(o.last_name)}</p></div><span class="pill">${esc(o.status)}</span></div>
    <p class="muted">${esc(o.email)}<br>${esc(o.phone)}<br>${esc(o.address)}, ${esc(o.postal_code)}</p>
    <p class="muted">Placed: ${esc((o.created_at||"").replace("T"," ").slice(0,16))}</p>
    <div class="items">${items}<div class="item"><b>Total</b><b>₱${Number(o.total).toFixed(2)}</b></div></div>
    ${o.note?`<p><b>Customer note:</b> ${esc(o.note)}</p>`:""}
    <form class="update-form">
     <div class="field"><label>Status</label><select name="status">
      ${["Pending","Confirmed","Preparing","Out for Delivery","Delivered","Cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}
     </select></div>
     <div class="two">
      <div class="field"><label>Estimated delivery date</label><input type="date" name="delivery_date" value="${esc(o.delivery_date||"")}"></div>
      <div class="field"><label>Estimated delivery time</label><input type="time" name="delivery_time" value="${esc(o.delivery_time||"")}"></div>
     </div>
     <div class="field"><label>Message to customer (optional)</label><textarea name="admin_note" rows="2" maxlength="500" placeholder="e.g. Your order is being prepared.">${esc(o.admin_note||"")}</textarea></div>
     <div class="order-actions"><button type="submit">Save update</button><span class="message"></span></div>
    </form>
   </article>`;
  }).join("");
  box.querySelectorAll(".update-form").forEach(form=>form.addEventListener("submit",async e=>{
   e.preventDefault();const card=form.closest(".order"),id=card.dataset.id,msg=form.querySelector(".message"),data=Object.fromEntries(new FormData(form));
   msg.textContent="Saving...";
   try{await api(`/api/admin/orders/${id}`,{method:"PATCH",body:JSON.stringify(data)});msg.style.color="#19733b";msg.textContent="Saved!";await loadOrders();}
   catch(err){msg.style.color="#a12619";msg.textContent=err.message;}
  }));
}
$("#status-filter").addEventListener("change",renderOrders);
$("#refresh-btn").onclick=loadOrders;
// Restore the authenticated dashboard when the admin refreshes the page.
(async()=>{try{await api("/api/admin/session");showDashboard()}catch(_){}})();
$("#logout-btn").onclick=async()=>{try{await api("/api/admin/logout",{method:"POST",body:"{}"});}finally{location.reload();}};
</script>
</body>
</html>
